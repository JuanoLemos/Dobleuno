name: CI

on:
  push:
    branches: [main, ola-*]
  pull_request:
    branches: [main, ola-*]

jobs:
  test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma imagen que docker-compose.yml: 0001_pgvector.sql pide la extension
        # `vector`, que la imagen oficial de postgres no trae.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dobleuno
          POSTGRES_PASSWORD: dobleuno_dev
          POSTGRES_DB: dobleuno
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dobleuno -d dobleuno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://dobleuno:dobleuno_dev@localhost:5432/dobleuno
      BETTER_AUTH_SECRET: ci-test-secret-min-32-chars-for-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-test-mock' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate web icons
        run: npm run icons:generate -w @dobleuno/web

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Sin esto la DB del runner queda vacía y los tests contra Postgres pasan
      # por el camino degradado (500/503), sin ejercitar nada: ni el esquema, ni
      # el UNIQUE(sesion_id, user_id) que sostiene el anti-doble-booking de Ola 9.
      - name: Migrate DB
        run: npm run db:migrate -w @dobleuno/server

      - name: Install pgvector extension
        run: npm run pgvector:install -w @dobleuno/server

      # El seed corre después de pgvector: el trigger kb_chunks_embedding_sync
      # ya existe, así que cada insert llena también embedding_vec y el camino
      # de retrieval del oráculo queda ejercitable.
      # --allow-missing: data/processed/ está gitignored (doc/Sources.md), así que
      # en el runner no hay corpus. El step queda como no-op verificable en vez de
      # romper el build.
      - name: Seed KB
        run: npm run kb:seed -w @dobleuno/server -- --allow-missing

      # Los tests del pipeline (scripts/) no corren con `npm test -ws`: scripts/
      # no es un workspace. Quedaban afuera de CI, justo donde vivió dos meses
      # el bug del mirror.
      - name: Pipeline tests
        run: npm run parse:test

      - name: Server tests
        run: npm test -w @dobleuno/server

      - name: Web tests
        run: npm test -w @dobleuno/web

      - name: Server build
        run: npm run build:server

      - name: Web build
        run: npm run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
